  version: '3.8'

  services:
    db:
      image: postgres:13
      environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 123
      volumes:
        - postgres_data:/var/lib/postgresql/data/
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5

    backend:
      build: .
      command: bash -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 artgallery.wsgi:application"
      environment:
        DB_ENGINE: django.db.backends.postgresql_psycopg2
        DB_NAME: postgres
        DB_USER: postgres
        DB_PASSWORD: 123
        DB_HOST: db
        DB_PORT: 5432
      volumes:
        - .:/app
      ports:
        - "8000:8000"
      depends_on:
        db:
          condition: service_healthy

  volumes:
    postgres_data: